version: "2"

linters:
  default: standard
  enable:
    # Response bodies that are never closed leak connections against the
    # Route53 API.
    - bodyclose
    # This code compares against sentinel errors like route53.ErrInvalid, so
    # errors.Is/As over == matters.
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test fixtures use predictable tokens and skip TLS setup on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
