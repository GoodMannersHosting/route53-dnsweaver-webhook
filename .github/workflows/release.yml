name: Release

# Publishing a GitHub Release creates the tag and fires this. Draft the notes
# in the UI; GoReleaser appends its generated changelog rather than replacing
# what you wrote.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # Lowercase on purpose: GHCR rejects mixed-case repository names, and
  # github.repository preserves the organisation's capitalisation.
  IMAGE: ghcr.io/goodmannershosting/route53-dnsweaver-webhook

jobs:
  # One job, because GoReleaser builds the binaries, the packages and the
  # container image from a single compile. Splitting the image into its own
  # job would mean building the Go binary a second time, under a different
  # toolchain, and shipping bytes the release archives never contained.
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload artifacts onto the release
      packages: write # push to GHCR
      id-token: write # cosign signatures and the attestations
      attestations: write
      # Attesting a pushed image also files a storage record, which lists the
      # image on the organisation's linked artifacts page. Without this the
      # attestation still lands, but the action warns that it couldn't.
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GoReleaser derives the version from the tag, and checkout doesn't
      # bring tags along even at full depth.
      - name: Fetch tags
        run: git fetch --force --tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # No QEMU needed: the image only copies an already cross-compiled static
      # binary, so nothing is executed for the non-native architecture.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # GoReleaser shells out to both of these. Versions are pinned because
      # the arguments in .goreleaser.yaml are version-specific: cosign 3
      # dropped the sign-blob flags cosign 2 used.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.50.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the binaries, packages, image and SBOMs, signs all of them with
      # keyless cosign, pushes the image to GHCR and uploads the rest onto the
      # release.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Complements the cosign signatures: those record who signed an
      # artifact, this records which workflow and commit produced it.
      # gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # GoReleaser records the digest it pushed for every image:tag it
      # produced. They all point at the same manifest index, so take the first.
      - name: Read image digest
        id: image
        run: |
          set -euo pipefail
          digest=$(jq -r 'first(.[] | select(.type == "Docker Image") | .extra.Digest)' dist/artifacts.json)
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::no Docker Image digest found in dist/artifacts.json"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Verify with:
      # gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --repo <owner>/<repo>
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # BuildKit already attached its own unsigned SBOM to the index. This
      # adds a signed one per architecture, attached to that architecture's
      # manifest, because syft resolves an index to whichever platform the
      # runner happens to be. The filter drops BuildKit's attestation
      # manifests, which carry no real platform. Verify with:
      #   cosign verify-attestation --type spdxjson ghcr.io/<owner>/<repo>@<digest>
      - name: Attest image SBOMs
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .Manifest }}' \
            | jq -r '.manifests[]? | select(.platform.os != "unknown") | .digest' \
            | while read -r manifest; do
                sbom="sbom-${manifest#sha256:}.spdx.json"
                syft "registry:${IMAGE}@${manifest}" --output "spdx-json=${sbom}"
                cosign attest --yes --type spdxjson \
                  --predicate "${sbom}" "${IMAGE}@${manifest}"
              done
